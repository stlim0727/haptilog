function badge(r){return `<span class="badge ${r.type==='memo'?'memo':r.type==='travel'?'travel':''}">${icon(r.type)}${r.category}</span>`}
function card(r){return `<button class="record" data-record="${r.id}" onclick="openRecord(${r.id},this)"><span class="record-top"><span>${r.time}</span>${badge(r)}</span><strong>${r.title}</strong><span class="record-foot">${icon('clock')} ${r.duration}<span>·</span>${r.place?`${icon('pin')} ${r.place}`:'위치 없음'}${r.amount?`<span class="amount">${r.amount}</span>`:''}${icon('chevron').replace('<svg','<svg class="arrow"')}</span></button>`}
function render(){document.title=`HaptiLog · ${{list:'기록',map:'지도',calendar:'달력',detail:'기록 상세',pair:'워치 연결',trash:'휴지통'}[view]}`; if(view==='detail'){detail();return}if(view==='pair'){pair();return}if(view==='trash'){app.innerHTML=header(true)+`<main><h1 tabindex="-1">휴지통</h1><div class="empty">${icon('trash')}<strong>휴지통이 비어 있어요</strong><p>삭제한 기록은 이곳에서 복원할 수 있어요.</p></div></main>`+footer();return}
app.innerHTML=header()+`<main><div class="eyebrow">YOUR VOICE, REMEMBERED.</div><h1 tabindex="-1">내가 남긴 순간들</h1><div class="toolbar"><button class="date-button" aria-label="조회 기간 선택" onclick="periodDialog()">${icon('calendar')}${period}${icon('chevron').replace('<svg','<svg style="transform:rotate(90deg);width:14px"')}</button><button class="icon" aria-label="기록 새로고침" onclick="toast('시안에는 예시 기록이 표시됩니다.')">${icon('refresh')}</button></div><div class="summary"><span>기록 <strong>4개</strong> <span aria-hidden="true">·</span> 총 2분 32초</span><span>지출 <strong>₩5,000</strong></span></div><nav class="tabs" aria-label="기록 보기">${[['list','목록','list'],['map','지도','map'],['calendar','달력','calendar']].map(([v,label,i])=>`<button ${view===v?'aria-current="page"':''} onclick="switchView('${v}')">${icon(i)}${label}</button>`).join('')}</nav><div class="search-row"><label class="search"><span class="sr-only">기록 검색</span>${icon('search')}<input type="search" placeholder="어떤 순간을 찾으세요?" value="${search.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}" oninput="search=this.value;updateContent()"></label><button class="outline filter" onclick="filterDialog()">${icon('filter')}필터${category!=='전체'?' · 1':''}</button></div>${category!=='전체'?`<div class="active-filter">분류: ${category}<button onclick="category='전체';render()">필터 해제 ×</button></div>`:''}<div id="content"></div><p class="sync">${icon('check')}오후 4:35 클라우드 확인 · 워치의 미업로드 기록은 표시되지 않아요.</p></main>`+footer();updateContent()}
function updateContent(){const root=document.querySelector('#content');if(!root)return;const list=filtered();if(view==='list'){root.innerHTML=list.length? [25,24].map(d=>{const rs=list.filter(r=>r.day===d);return rs.length?`<div class="day-heading">10월 ${d}일 ${d===25?'일요일 · 오늘':'토요일'}<span>${rs.length}개</span></div>${rs.map(card).join('')}`:''}).join(''):`<div class="empty empty-list">${icon('search')}<strong>찾는 기록이 없어요</strong><p>다른 검색어나 필터로 찾아보세요.</p></div>`}else if(view==='calendar')calendar(root,list);else map(root,list)}
function switchView(v){view=v;history.replaceState({view},'',`?view=${view}`);render();document.querySelector('.tabs [aria-current=page]')?.focus({preventScroll:true})}
function calendar(root,list){const count=new Date(year,month,0).getDate(),offset=new Date(year,month-1,1).getDay();const relevant=year===2026&&month===10;const rs=relevant?list.filter(r=>r.day===date):[];root.innerHTML=`<section class="calendar" aria-label="날짜 선택"><div class="cal-head"><h2>${year}년 ${month}월</h2><div class="cal-nav"><button class="text-button" onclick="year=2026;month=10;date=25;updateContent()">오늘</button><button class="icon" aria-label="이전 달" onclick="shiftMonth(-1)">${icon('back')}</button><button class="icon" aria-label="다음 달" onclick="shiftMonth(1)">${icon('chevron')}</button></div></div><div class="week">${['일','월','화','수','목','금','토'].map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${Array.from({length:offset},()=>'<span></span>').join('')}${Array.from({length:count},(_,i)=>{const d=i+1,n=relevant?list.filter(r=>r.day===d).length:0;return `<button aria-label="${year}년 ${month}월 ${d}일, 기록 ${n}개" aria-pressed="${date===d}" class="${relevant&&d===25?'today':''}" onclick="selectDay(${d})">${d}<i class="${n?'daydot':'dot-space'}"></i></button>`}).join('')}</div></section><div class="day-heading" aria-live="polite">${month}월 ${date}일의 기록<span>${rs.length}개</span></div>${rs.length?rs.map(card).join(''):`<div class="empty">${icon('calendar')}<strong>이날 남긴 기록이 없어요</strong><p>다른 날짜를 선택해 보세요.</p><button class="text-button" onclick="nearestDay()">가장 최근 기록 날짜로 이동</button></div>`}`}
function nearestDay(){year=2026;month=10;date=25;updateContent();document.querySelector('.days button[aria-pressed=true]')?.focus()}
function selectDay(d){date=d;updateContent();document.querySelector('.days button[aria-pressed=true]')?.focus()}
function shiftMonth(n){month+=n;if(month===0){month=12;year--}if(month===13){month=1;year++}date=1;updateContent();document.querySelector(`[aria-label="${n<0?'이전':'다음'} 달"]`)?.focus()}
function map(root,list){const located=list.filter(r=>r.place),places=[...new Set(located.map(r=>r.place))],firstPlace=places.includes(selectedPlace)?selectedPlace:places[0],rs=located.filter(r=>r.place===firstPlace);root.innerHTML=`<div class="section-head"><h2>기록을 남긴 장소</h2><span class="small">위치 있는 기록 ${located.length}개 · 장소 ${places.length}곳</span></div><div class="map" role="region" aria-label="예시 기록 지도"><svg viewBox="0 0 350 267" preserveAspectRatio="none" aria-hidden="true"><rect width="350" height="267" fill="#202a2b"/><path d="M240 -20 200 40 223 100 180 145 203 210 170 290" stroke="#344c54" stroke-width="60" fill="none"/><path d="M-20 90 370 40M-10 190 370 150M50 -20 110 290M290 -20 330 290" stroke="#4b5355" stroke-width="7" fill="none"/><path d="M-20 90 370 40M-10 190 370 150M50 -20 110 290M290 -20 330 290" stroke="#87908b" stroke-width="1" fill="none"/><rect x="102" y="79" width="88" height="65" rx="20" fill="#324337"/><text x="125" y="113" fill="#a8b6a7" font-size="12">서울숲</text><text x="240" y="230" fill="#a1bdc7" font-size="12">한강</text></svg>${located.some(r=>r.place==='서울숲')?`<button class="pin pin-a" aria-label="서울숲 기록 ${located.filter(r=>r.place==='서울숲').length}개 보기" aria-pressed="${firstPlace==='서울숲'}" onclick="selectPlace('서울숲')">${located.filter(r=>r.place==='서울숲').length}</button>`:''}${located.some(r=>r.place!=='서울숲')?`<button class="pin pin-b" aria-label="뚝섬한강공원 기록 보기" aria-pressed="${firstPlace==='뚝섬한강공원'}" onclick="selectPlace('뚝섬한강공원')">1</button>`:''}<span class="map-label">배치 예시 · 실제 지도 아님</span></div><p class="map-note">위치 없는 기록 ${list.length-located.length}개 <button class="text-button" onclick="switchView('list')">목록에서 보기</button></p><section id="place-records" aria-live="polite">${firstPlace?placeCards(rs,firstPlace):'<div class="empty"><strong>지도에 표시할 기록이 없어요</strong><p>다른 필터를 선택하거나 목록에서 찾아보세요.</p></div>'}</section>`}
function placeCards(rs,name){return `<div class="day-heading">${name}<span>기록 ${rs.length}개</span></div>${rs.length?rs.map(card).join(''):'<p class="small">이 필터에 해당하는 기록이 없어요.</p>'}`}
function selectPlace(name){selectedPlace=name;document.querySelectorAll('.pin').forEach(b=>b.setAttribute('aria-pressed',b.getAttribute('aria-label').startsWith(name)));document.querySelector('#place-records').innerHTML=placeCards(filtered().filter(r=>r.place===name),name)}
function openRecord(id,el){savedY=scrollY;returnFocus=el?.dataset.record;active=id;history.replaceState({view,y:savedY,record:returnFocus},'');history.pushState({view:'detail'},'',`?view=detail&id=${id}`);view='detail';render();scrollTo(0,0);document.querySelector('h1').focus({preventScroll:true})}
function goBack(){if(['detail','trash'].includes(history.state?.view))history.back();else{view='list';render();history.replaceState({view},'','?view=list');scrollTo(0,0)}}
onpopstate=e=>{view=e.state?.view||'list';render();requestAnimationFrame(()=>{document.querySelector('.tabs [aria-current=page]')?.focus({preventScroll:true});scrollTo(0,e.state?.y||0);const el=document.querySelector(`[data-record="${e.state?.record}"]`);el?.focus({preventScroll:true})})};
function detail(){const r=records.find(x=>x.id===active)||records[0];app.innerHTML=header(true)+`<main>${badge(r)}<h1 class="detail-title" tabindex="-1">${r.title}</h1><p class="small">2026년 10월 ${r.day}일 · ${r.time} · ${r.duration}</p><section class="player" aria-label="원본 음성"><div class="player-label">${icon('headphones')}원본 음성 <span style="margin-left:auto">기록의 원본</span></div><div class="play-row"><button class="play" aria-label="원본 음성 재생 시안" onclick="toast('재생 버튼의 배치 시안입니다. 실제 음성은 연결하지 않았어요.')">${icon('play')}</button><div class="wave" aria-hidden="true">${Array.from({length:38},(_,i)=>`<i style="height:${8+Math.abs(Math.sin(i*1.7))*26}px"></i>`).join('')}</div></div><div class="progress-label"><span>0:00</span><span>${r.duration}</span></div></section><section class="block"><div class="section-head"><h2>음성 텍스트</h2><button class="text-button" onclick="toast('텍스트 편집 진입점입니다. 시안에서는 저장하지 않아요.')">수정</button></div><div class="small">AI가 옮긴 내용 · 원본 음성과 비교해 주세요</div><p>${r.text}</p><details style="margin-top:18px"><summary class="small">원본 텍스트와 수정 이력</summary><p class="small">수정 이력이 없어요. 원본 음성은 수정하지 않습니다.</p></details></section>${r.amount?`<section class="block"><div class="section-head"><h2>지출 정보</h2><button class="text-button" onclick="toast('지출 수정 화면 진입점입니다.')">수정</button></div><div class="data-row">금액<strong>${r.amount}</strong></div><div class="data-row">사용처<strong>코너 커피</strong></div></section>`:''}<section class="block"><h2>기록한 장소</h2><p>${r.place||'위치 정보가 없어요'}</p>${r.place?`<button class="plain-link" onclick="toast('실제 서비스에서는 저장된 좌표의 지도를 엽니다.')">${icon('pin')}지도에서 보기 ${icon('chevron')}</button>`:''}<p class="small">녹음할 때 저장한 위치예요.</p></section><button class="outline full destructive" onclick="toast('휴지통 이동 확인 화면 진입점입니다. 예시 기록은 유지돼요.')">${icon('trash')}휴지통으로 이동</button></main>`+footer()}
function pair(){app.innerHTML=`<header><div class="brand"><span class="mark">${icon('wave')}</span>haptilog<em>.</em></div><button class="icon" aria-label="언어 선택" onclick="toast('한국어 시안입니다.')">KO</button></header><main class="pair"><div class="eyebrow">HAPTILOG WEB</div><h1 tabindex="-1">워치와 연결하기</h1><p class="sub">워치에 표시된 접속 코드로 연결하면<br>업로드된 음성 기록을 볼 수 있어요.</p><form class="pair-box" onsubmit="event.preventDefault();connect()"><label for="code">6자리 접속 코드</label><input class="code" id="code" name="code" placeholder="000000" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required aria-describedby="code-help"><p class="small" id="code-help">워치 앱 → 웹 접속 → 코드 생성</p><p class="error" id="code-error" role="alert"></p><button class="primary full" style="margin-top:20px" type="submit">워치 연결하기</button><details class="help"><summary>접속 코드를 찾을 수 없나요?</summary><p class="small" style="margin-top:10px">워치에서 HaptiLog를 열고 설정의 ‘웹 접속’으로 이동하세요. 코드는 5분 동안 유효하며 만료되면 새로 생성할 수 있어요.</p></details></form><p class="small">연결된 브라우저에서 내 기록에 접근할 수 있어요.<br>공용 기기에서는 사용 후 연결을 해제해 주세요.</p><div class="notice">이 시안에서는 임의의 6자리 숫자를 입력하면 예시 기록이 열립니다.</div></main>`+footer()}
function connect(){const v=document.querySelector('#code').value;if(!/^\d{6}$/.test(v)){document.querySelector('#code-error').textContent='숫자 6자리를 입력해 주세요.';return}view='list';history.replaceState({view},'','?view=list');render();scrollTo(0,0);document.querySelector('h1').focus({preventScroll:true})}
function showDialog(html){dialog.innerHTML=html;dialog.showModal()}
function filterDialog(){showDialog(`<div class="section-head"><h2 id="dialog-title">기록 필터</h2><button class="icon" aria-label="닫기" onclick="dialog.close()">${icon('close')}</button></div><label for="category">분류</label><select id="category">${['전체','지출','여행','운동','메모'].map(c=>`<option ${category===c?'selected':''}>${c}</option>`).join('')}</select><button class="primary full" style="margin-top:24px" onclick="category=document.querySelector('#category').value;dialog.close();render();document.querySelector('.filter').focus()">필터 적용</button>`)}
function periodDialog(){showDialog(`<div class="section-head"><h2 id="dialog-title">조회 기간</h2><button class="icon" aria-label="닫기" onclick="dialog.close()">${icon('close')}</button></div><p class="small">시안에는 2026년 10월 예시 데이터가 표시됩니다.</p><button class="menu-option" onclick="period='이번 달';dialog.close();render();document.querySelector('.date-button')?.focus()">2026년 10월 · 이번 달</button><button class="menu-option" onclick="period='전체 기간';dialog.close();render();document.querySelector('.date-button')?.focus()">전체 기간</button>`)}
function menu(isDetail){showDialog(`<div class="section-head"><h2 id="dialog-title">${isDetail?'기록 메뉴':'더보기'}</h2><button class="icon" aria-label="닫기" onclick="dialog.close()">${icon('close')}</button></div>${isDetail?`<button class="menu-option destructive" onclick="dialog.close();toast('휴지통 이동 확인 진입점입니다.')">${icon('trash')}휴지통으로 이동</button>`:`<button class="menu-option" onclick="dialog.close();openTrash()">${icon('trash')}휴지통</button><button class="menu-option" onclick="dialog.close();toast('CSV 내보내기 진입점입니다.')">${icon('download')}CSV 내보내기</button><button class="menu-option" onclick="dialog.close();toast('Notion 연결 설정 진입점입니다.')">${icon('memo')}Notion 연결</button><button class="menu-option" onclick="dialog.close();toast('실제 서비스에서는 연결 해제를 확인합니다.')">${icon('close')}워치 연결 관리</button>`}`)}
function openTrash(){savedY=scrollY;history.replaceState({view,y:savedY},'');history.pushState({view:'trash'},'','?view=trash');view='trash';render();scrollTo(0,0);document.querySelector('h1')?.focus({preventScroll:true})}
let toastTimer;function toast(msg){document.querySelector('.toast')?.remove();clearTimeout(toastTimer);const n=document.createElement('div');n.className='toast';n.setAttribute('role','status');n.textContent=msg;document.body.append(n);toastTimer=setTimeout(()=>n.remove(),3500)}
const params=new URLSearchParams(location.search);view=params.get('view')||'list';if(!['list','map','calendar','detail','pair','trash','welcome','account','watches','link-account','unlink-watch','signin-error'].includes(view))view='list';if(params.get('empty'))date=26;if(params.get('id'))active=Number(params.get('id'));history.replaceState({view},'');render();
</script><script src="account-prototype.js"></script></html>
