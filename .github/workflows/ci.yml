name: CI

# Continuous Integration workflow for HaptiLog
# - Builds and validates Wear OS Kotlin / Compose application
# - Generates debug APK artifact for easy mobile sideloading
# - Runs static checks and validates Gradle wrapper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wear-os-build:
    name: Wear OS Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Grant execute permission for gradlew
        run: chmod +x watch/gradlew

      - name: Build Debug APK & Run Lint
        working-directory: watch
        run: |
          ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace

      - name: Upload Wear OS Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: haptilog-wear-debug
          path: watch/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  backend-lint:
    name: Backend & Migration Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test enrichment authorization and validation
        run: node --experimental-strip-types --test tests/voice-enrich.test.mjs tests/watch-access.test.mjs tests/notion-export.test.mjs

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4

      - name: Validate migration and ownership policies
        run: |
          npm ci --prefix supabase/tests --ignore-scripts
          npm test --prefix supabase/tests

      - name: Typecheck Edge Function
        run: deno check --lock=supabase/functions/deno.lock supabase/functions/voice-enrich/index.ts supabase/functions/watch-access/index.ts supabase/functions/notion-export/index.ts

  portal:
    name: Portal build and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-browser-results
          path: web/test-results/
