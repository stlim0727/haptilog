name: Wear OS Play Store Release

# Builds a Play-ready Wear OS Android App Bundle (AAB) and auto-submits
# it to Google Play Console Internal Testing track.
#
# Manual dispatch or tag push release line.
# Required repo secrets:
#   PLAY_SERVICE_ACCOUNT_JSON : Service Account JSON key from Google Cloud / Play Console
#   KEYSTORE_BASE64           : Base64 encoded release.keystore
#   KEYSTORE_PASSWORD         : Keystore password
#   KEY_ALIAS                 : Key alias
#   KEY_PASSWORD              : Key password

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Target Play Store track (internal, alpha, beta, production)'
        required: true
        default: 'internal'

concurrency:
  group: wear-playstore
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > watch/app/release.keystore

      - name: Build Wear OS Bundle (AAB)
        working-directory: watch
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.haptilog.watch
          releaseFiles: watch/app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
