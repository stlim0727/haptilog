name: Wear OS Play Store Release

# Builds a Play-ready Wear OS Android App Bundle (AAB) and auto-submits
# it to Google Play Console Internal Testing track.
#
# Manual dispatch or tag push release line.
# Required repo secrets:
#   PLAY_SERVICE_ACCOUNT_JSON : Service Account JSON key from Google Cloud / Play Console
#   KEYSTORE_BASE64           : Base64 encoded release.keystore
#   KEYSTORE_PASSWORD         : Keystore password
#   KEY_ALIAS                 : Key alias
#   KEY_PASSWORD              : Key password

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Target Play Store track (wear:internal, wear:qa, internal, wear:beta, wear:production)'
        required: true
        default: 'wear:internal'
      status:
        description: 'Release status (completed, draft, inProgress, halted)'
        required: false
        default: 'draft'

concurrency:
  group: wear-playstore
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > watch/app/release.keystore

      - name: Build Wear OS Bundle (AAB)
        working-directory: watch
        env:
          HAPTILOG_SUPABASE_URL: ${{ vars.HAPTILOG_SUPABASE_URL }}
          HAPTILOG_SUPABASE_PUBLISHABLE_KEY: ${{ vars.HAPTILOG_SUPABASE_PUBLISHABLE_KEY }}
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haptilog-wear-release-bundle
          path: |
            watch/app/build/outputs/bundle/release/*.aab
            watch/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Resolve Play Store Track
        id: play_track
        run: |
          RAW_TRACK="${{ github.event.inputs.track || 'wear:internal' }}"
          # Wear OS standalone bundles must target form-factor tracks prefixed with 'wear:'
          case "$RAW_TRACK" in
            wear:*)
              RESOLVED_TRACK="$RAW_TRACK"
              ;;
            production)
              RESOLVED_TRACK="wear:production"
              ;;
            internal)
              RESOLVED_TRACK="wear:internal"
              ;;
            beta)
              RESOLVED_TRACK="wear:beta"
              ;;
            alpha)
              RESOLVED_TRACK="wear:alpha"
              ;;
            *)
              RESOLVED_TRACK="$RAW_TRACK"
              ;;
          esac
          echo "track=$RESOLVED_TRACK" >> $GITHUB_OUTPUT
          echo "Resolved target track '$RAW_TRACK' to '$RESOLVED_TRACK'"

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.haptilog.watch
          releaseFiles: watch/app/build/outputs/bundle/release/*.aab
          tracks: ${{ steps.play_track.outputs.track }}
          mappingFile: watch/app/build/outputs/mapping/release/mapping.txt
          status: ${{ github.event.inputs.status || 'draft' }}
          # Committing an edit otherwise also submits previously saved policy/listing changes.
          changesNotSentForReview: true
